<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam</title>
<meta name="description" content="Send links, notes and files to your phone via ntfy.">
<meta name="theme-color" content="#f5f5f3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%234f6bff'/%3E%3C/svg%3E">
<script>
  // Paint the remembered design's background before anything loads, so there is no flash on dark designs.
  try {
    var d = localStorage.getItem('beam.design'), dark = matchMedia('(prefers-color-scheme: dark)').matches;
    var bg = { signal: '#05060a', teleprinter: dark ? '#181715' : '#e8e2d6', lockscreen: dark ? '#0d0d0e' : '#f3f2ef', classic: dark ? '#0c0c0d' : '#f5f5f3' }[d];
    if (bg) document.documentElement.style.background = bg;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<link rel="modulepreload" href="app/core.js">
<style>
  /* Shell only. Each design brings its own stylesheet into #design-css. */
  #app { display: contents; }
  html:not(.ready) body { opacity: 0; }
  body { transition: opacity .25s; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }

  .beam-dock { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; align-items: center; gap: 2px; padding: 4px;
    border-radius: 999px; border: 1px solid var(--beam-line, rgb(127 127 127 / .25));
    background: color-mix(in srgb, var(--beam-bg, #fff) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--beam-muted, #888); font: 11px/1 var(--beam-font, system-ui, sans-serif); opacity: .45; transition: opacity .3s;
    view-transition-name: beam-dock; }
  .beam-dock:hover, .beam-dock:focus-within { opacity: 1; }
  @media (pointer: coarse) { .beam-dock { opacity: .7; } }
  .beam-dock button { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 50%; padding: 0;
    background: none; color: inherit; cursor: pointer; transition: background .2s, color .2s; }
  .beam-dock button:hover, .beam-dock button[aria-pressed="true"] { color: var(--beam-ink, #111); background: rgb(127 127 127 / .14); }
  .beam-dock button.off { opacity: .6; }
  .beam-dock i { width: 1px; height: 14px; margin: 0 4px; background: currentColor; opacity: .3; }
  .beam-dock [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 9px); left: 50%; translate: -50% 0; white-space: nowrap;
    padding: 4px 8px; border-radius: 6px; background: var(--beam-ink, #111); color: var(--beam-bg, #fff); pointer-events: none; }
  .beam-dock > :last-child:hover::after { left: auto; right: 0; translate: 0; }
</style>
<style id="design-css"></style>
</head>
<body>
<div id="app"></div>
<noscript>Beam needs JavaScript to send to ntfy.</noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
