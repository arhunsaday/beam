<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam · Lockscreen</title>
<meta name="description" content="Send links, notes and files to your phone — with a live preview of the notification.">
<meta name="theme-color" content="#f3f2ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%234f6bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root {
    --bg: #f3f2ef; --card: #fff; --ink: #121212; --soft: #55554f; --muted: #96958f; --line: #e3e1dc; --hover: #efeeea;
    --accent: #4f6bff; --ok: #34c759; --err: #ff453a;
    --beam-bg: var(--card); --beam-ink: var(--ink); --beam-muted: var(--muted); --beam-line: var(--line); --beam-accent: var(--accent);
    --beam-font: Geist, system-ui, sans-serif; --beam-mono: "Geist Mono", ui-monospace, monospace; --beam-radius: 20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0d0e; --card: #161618; --ink: #f0f0ee; --soft: #b0b0ac; --muted: #707073; --line: #262629; --hover: #1e1e21;
            --accent: #8197ff; color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 Geist, system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 40px 16px; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(40% 35% at 75% 40%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%); }
  .wrap { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr 320px; gap: 72px; align-items: center; }

  /* ---------- composer ---------- */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 40px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  h1 { font-size: clamp(34px, 5vw, 50px); line-height: 1.02; letter-spacing: -.035em; font-weight: 600; }
  h1 span { color: var(--muted); }
  .sub { color: var(--soft); margin: 14px 0 28px; font-size: 16px; max-width: 30em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 4px;
          box-shadow: 0 1px 2px rgb(0 0 0 / .03), 0 18px 50px -20px rgb(0 0 0 / .12); transition: border-color .2s, box-shadow .2s; }
  .card.drag { border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent); }
  textarea { display: block; width: 100%; min-height: 128px; resize: none; border: 0; outline: 0; background: none; color: inherit;
             font: inherit; font-size: 17px; padding: 16px 18px 4px; transition: opacity .3s; }
  textarea::placeholder { color: var(--muted); }
  .sending textarea { opacity: .3; }
  .file { display: none; align-items: center; gap: 12px; margin: 6px 12px 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 13px; }
  .file.on { display: flex; animation: rise .3s cubic-bezier(.2, 1.3, .4, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .file .thumb { width: 34px; height: 34px; border-radius: 9px; background: var(--hover); display: grid; place-items: center; overflow: hidden; flex: none; font-size: 16px; }
  .file .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file .meta { flex: 1; min-width: 0; } .file .n { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .s { font-size: 12px; color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; }
  .chip { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip b { color: var(--soft); font-weight: 500; }
  .icon { width: 38px; height: 38px; border: 0; border-radius: 11px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .send { display: flex; align-items: center; gap: 8px; border: 0; border-radius: 14px; background: var(--ink); color: var(--card);
          font: inherit; font-weight: 550; padding: 10px 14px 10px 18px; cursor: pointer; transition: opacity .2s, transform .12s; }
  .send svg { transition: transform .25s cubic-bezier(.2, 1.4, .4, 1); }
  .send:hover svg { transform: translateX(3px) rotate(-12deg); }
  .send:active { transform: scale(.96); }
  .send:disabled { opacity: .25; cursor: default; transform: none; }
  .send:disabled svg { transform: none; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 6px; font-size: 12.5px; color: var(--muted); }
  .topic { border: 0; background: none; color: inherit; font: 12.5px "Geist Mono", monospace; cursor: pointer; padding: 4px 8px; border-radius: 8px; margin-left: -8px; }
  .topic:hover { background: var(--hover); color: var(--ink); }
  kbd { font: 11px "Geist Mono", monospace; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  @media (pointer: coarse) { .kbd-hint { display: none; } }

  /* ---------- phone ---------- */
  .phone { position: relative; width: 320px; height: 650px; border-radius: 56px; padding: 11px; background: #0b0b0c;
           box-shadow: inset 0 0 0 1.5px #3a3a3e, inset 0 0 0 4px #0b0b0c, inset 0 0 0 5px #222, 0 50px 100px -30px rgb(20 20 40 / .45), 0 30px 60px -30px rgb(0 0 0 / .4); }
  .phone.buzz { animation: buzz .42s linear; }
  @keyframes buzz { 0%,100% { transform: none; } 10%,50%,90% { transform: translateX(-3px) rotate(-.6deg); } 30%,70% { transform: translateX(3px) rotate(.6deg); } }
  .screen { position: relative; height: 100%; border-radius: 46px; overflow: hidden; background: #10112a; color: #fff; isolation: isolate; }
  .wall { position: absolute; inset: -30%; z-index: -1; filter: blur(40px) saturate(1.3); }
  .wall i { position: absolute; border-radius: 50%; animation: drift 16s ease-in-out infinite alternate; }
  .wall i:nth-child(1) { width: 60%; height: 50%; left: 5%; top: 10%; background: #ff7a59; }
  .wall i:nth-child(2) { width: 65%; height: 55%; right: 0; top: 30%; background: #6c5cff; animation-duration: 19s; animation-delay: -6s; }
  .wall i:nth-child(3) { width: 55%; height: 45%; left: 20%; bottom: 0; background: #1fc7b6; animation-duration: 22s; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(18%, -12%) scale(1.15); } }
  .screen::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgb(0 0 0 / .15), rgb(0 0 0 / .35)); }
  .status { display: flex; justify-content: space-between; padding: 16px 30px 0; font-size: 14px; font-weight: 600; }
  .status svg { vertical-align: -2px; }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 100px; height: 30px; border-radius: 20px; background: #000;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden;
            transition: width .5s cubic-bezier(.2, 1.25, .35, 1), height .5s cubic-bezier(.2, 1.25, .35, 1); z-index: 5; }
  .island > * { opacity: 0; transition: opacity .2s; }
  .island.on { width: 196px; height: 38px; } .island.on > * { opacity: 1; transition-delay: .18s; }
  .island i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .island.err i { background: var(--err); box-shadow: 0 0 10px var(--err); }
  .island small { color: #8e8e93; font: 12px "Geist Mono", monospace; }
  .clock { text-align: center; margin-top: 34px; text-shadow: 0 1px 20px rgb(0 0 0 / .15); }
  .clock .d { font-size: 16px; font-weight: 500; opacity: .9; }
  .clock .t { font-size: 84px; font-weight: 600; line-height: 1; letter-spacing: -.03em; margin-top: 2px; }
  .stack { position: absolute; left: 12px; right: 12px; top: 232px; display: grid; gap: 8px; }
  .notif { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 11px 13px; border-radius: 22px; color: #111;
           background: rgb(250 250 252 / .72); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
           box-shadow: 0 6px 20px -8px rgb(0 0 0 / .25); transform-origin: 50% 0; }
  .notif .app { width: 34px; height: 34px; border-radius: 9px; background: #121212; display: grid; place-items: center; }
  .notif .app::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: #8197ff; box-shadow: 0 0 0 3px rgb(129 151 255 / .25); }
  .notif .h { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .notif .h b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notif .w { color: #6b6b70; font-size: 12px; flex: none; }
  .notif .b { font-size: 13.5px; line-height: 1.35; color: #222; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .notif.draft { background: rgb(250 250 252 / .4); outline: 1.5px dashed rgb(255 255 255 / .55); outline-offset: -1.5px; }
  .notif.draft .w { color: #fff; background: rgb(0 0 0 / .25); padding: 0 7px; border-radius: 8px; font-size: 11px; line-height: 18px; }
  .notif .sk { display: none; gap: 6px; padding-top: 4px; } .notif .sk i { height: 8px; border-radius: 4px; background: rgb(255 255 255 / .5); }
  .notif .sk i:first-child { width: 55%; } .notif .sk i:last-child { width: 85%; }
  .notif.ghost .h, .notif.ghost .b { display: none; } .notif.ghost .sk { display: grid; }
  .notif.ghost .sk i { background: linear-gradient(90deg, rgb(255 255 255 / .35), rgb(255 255 255 / .75), rgb(255 255 255 / .35)) 0 0 / 200% 100%; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .notif.old { opacity: .82; }
  .home { position: absolute; bottom: 9px; left: 50%; translate: -50% 0; width: 120px; height: 5px; border-radius: 3px; background: rgb(255 255 255 / .85); }
  .fly { position: fixed; z-index: 50; pointer-events: none; padding: 8px 14px; border-radius: 14px; background: var(--ink); color: var(--card);
         font-size: 14px; font-weight: 500; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 10px 30px -8px rgb(0 0 0 / .4); }

  @media (max-width: 880px) {
    .wrap { grid-template-columns: 1fr; gap: 40px; justify-items: center; }
    .composer { width: 100%; max-width: 560px; }
    .brand { margin-bottom: 28px; }
    .phone { zoom: .74; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="composer">
    <div class="brand"><div class="dot"></div>Beam</div>
    <h1>Send it to your phone.<br><span>Instantly.</span></h1>
    <p class="sub">Paste a link, jot a note or drop a file. It shows up as a notification — no apps to sign into, no cables.</p>
    <div class="card" id="card">
      <textarea id="msg" placeholder="Paste a link, type a note, or drop a file…" autofocus></textarea>
      <div class="file" id="file"><div class="thumb" id="thumb"></div><div class="meta"><div class="n" id="fname"></div><div class="s" id="fsize"></div></div>
        <button class="icon" id="unfile" aria-label="Remove file"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="bar">
        <div class="chip" id="chip"></div>
        <button class="icon" id="attach" aria-label="Attach file"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg></button>
        <button class="send" id="send" disabled>Send <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="meta-row"><button class="topic" id="topic"></button><span class="kbd-hint"><kbd id="mod">⌘</kbd> <kbd>↵</kbd> to send</span></div>
  </section>

  <div class="phone" id="phone" aria-hidden="true">
    <div class="screen">
      <div class="wall"><i></i><i></i><i></i></div>
      <div class="island" id="island"><i></i><span id="islandText"></span><small id="islandMs"></small></div>
      <div class="status"><span id="sbTime">9:41</span><span><svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#fff"/><path d="M23 4v4" stroke="#fff" opacity=".5" stroke-width="1.5" stroke-linecap="round"/></svg></span></div>
      <div class="clock"><div class="d" id="date"></div><div class="t" id="time"></div></div>
      <div class="stack" id="stack"></div>
      <div class="home"></div>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const msg = $('msg'), sendBtn = $('send'), stack = $('stack'), card = $('card'), phone = $('phone');
let file = null, busy = false;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- clock ---------- */
function tick() {
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  $('sbTime').textContent = $('time').textContent;
  $('date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  for (const n of stack.querySelectorAll('.notif[data-t]')) {
    const m = Math.floor((Date.now() - n.dataset.t) / 60000);
    n.querySelector('.w').textContent = m < 1 ? 'now' : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ago`;
  }
}
tick(); setInterval(tick, 15000);

/* ---------- notifications ---------- */
function notif() {
  const el = document.createElement('div');
  el.className = 'notif draft ghost';
  el.innerHTML = '<div class="app"></div><div><div class="h"><b></b><span class="w">preview</span></div><div class="b"></div><div class="sk"><i></i><i></i></div></div>';
  return el;
}
const draft = () => stack.querySelector('.draft');
function fill(el, d) {
  el.classList.toggle('ghost', d.kind === 'empty');
  if (d.kind === 'empty') return;
  el.querySelector('b').textContent = `${d.emoji} ${d.title}`;
  el.querySelector('.b').textContent = d.body;
}
stack.append(notif());

/* FLIP: animate siblings smoothly when the stack changes */
function flip(mutate) {
  const before = new Map([...stack.children].map((c) => [c, c.getBoundingClientRect().top]));
  mutate();
  for (const c of stack.children) {
    const was = before.get(c);
    if (was == null) continue;
    const dy = was - c.getBoundingClientRect().top;
    if (dy) c.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2, 1.1, .3, 1)' });
  }
}

/* ---------- composer ---------- */
function render() {
  const d = Beam.detect(msg.value, file);
  $('chip').innerHTML = d.kind === 'empty' ? '' : `<b>${d.kind === 'link' ? 'Link' : d.kind === 'file' ? 'File' : 'Note'}</b> · ${esc(d.kind === 'link' ? d.host : d.kind === 'file' ? d.size : msg.value.trim().length + ' chars')}`;
  sendBtn.disabled = d.kind === 'empty';
  fill(draft(), d);
}
function setFile(f) {
  file = f || null;
  $('file').classList.toggle('on', !!file);
  if (file) {
    $('fname').textContent = file.name; $('fsize').textContent = Beam.fmtSize(file.size);
    $('thumb').innerHTML = file.type.startsWith('image/') ? `<img src="${URL.createObjectURL(file)}" alt="">` : '📎';
  }
  msg.placeholder = file ? 'Add a message (optional)…' : 'Paste a link, type a note, or drop a file…';
  render(); msg.focus();
}
msg.addEventListener('input', render);
$('attach').onclick = async () => setFile(await Beam.pickFile());
$('unfile').onclick = () => setFile(null);
$('topic').onclick = Beam.openSettings;
Beam.onConfig((c) => { $('topic').textContent = `→ ${Beam.serverHost()}/${c.topic}`; });
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('mod').textContent = 'Ctrl';

/* ---------- island ---------- */
let islandTimer;
function island(text, ms, ok = true) {
  const el = $('island');
  $('islandText').textContent = text; $('islandMs').textContent = ms ?? '';
  el.classList.toggle('err', !ok); el.classList.add('on');
  clearTimeout(islandTimer); islandTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ---------- the flight: composer → phone along an arc ---------- */
function fly(label, from, to) {
  if (Beam.reducedMotion || !phone.offsetParent) return Promise.resolve();
  const el = document.createElement('div');
  el.className = 'fly'; el.textContent = label;
  document.body.append(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const sx = from.left + 18, sy = from.top + 14, ex = to.left + to.width / 2 - w / 2, ey = to.top + to.height / 2 - h / 2;
  const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 140;
  const frames = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, u = 1 - t;
    const x = u * u * sx + 2 * u * t * cx + t * t * ex, y = u * u * sy + 2 * u * t * cy + t * t * ey;
    frames.push({ transform: `translate(${x}px, ${y}px) scale(${1 - t * .55}) rotate(${Math.sin(t * Math.PI) * -8}deg)`, opacity: t > .9 ? (1 - t) * 10 : 1 });
  }
  el.style.left = el.style.top = '0';
  return el.animate(frames, { duration: 720, easing: 'cubic-bezier(.45, 0, .2, 1)' }).finished.then(() => el.remove());
}

async function send() {
  const d = Beam.detect(msg.value, file);
  if (d.kind === 'empty' || busy) return;
  busy = true; card.classList.add('sending'); sendBtn.disabled = true;
  const label = d.kind === 'file' ? `📎 ${file.name}` : msg.value.trim().replace(/\s+/g, ' ').slice(0, 40);
  const req = Beam.send({ text: msg.value, file });
  Beam.sfx('send');
  try {
    await Promise.all([req, fly(label, msg.getBoundingClientRect(), draft().getBoundingClientRect())]);
    const { ms } = await req;
    const sent = draft();
    phone.classList.remove('buzz'); void phone.offsetWidth; phone.classList.add('buzz');
    navigator.vibrate?.(40);
    Beam.sfx('buzz'); Beam.sfx('deliver', null, 300);
    sent.classList.remove('draft'); sent.dataset.t = Date.now(); sent.querySelector('.w').textContent = 'now';
    sent.animate([{ transform: 'scale(.92)', filter: 'brightness(1.4)' }, { transform: 'scale(1.03)' }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2, 1.2, .4, 1)' });
    const next = notif();
    flip(() => stack.prepend(next));
    next.animate([{ opacity: 0, transform: 'translateY(-14px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 240, fill: 'backwards', easing: 'cubic-bezier(.2, 1.2, .4, 1)' });
    [...stack.querySelectorAll('.notif:not(.draft)')].forEach((n, i) => { n.classList.toggle('old', i > 0); if (i > 2) n.animate({ opacity: [1, 0] }, 300).finished.then(() => n.remove()); });
    island('Delivered', `${ms}ms`);
    msg.value = ''; setFile(null);
  } catch (e) {
    island(e.message.slice(0, 24), null, false);
    Beam.sfx('error');
    draft().animate({ transform: ['translateX(0)', 'translateX(-8px)', 'translateX(7px)', 'translateX(-4px)', 'translateX(0)'] }, 380);
  } finally {
    busy = false; card.classList.remove('sending'); render();
  }
}
sendBtn.onclick = send;
Beam.wire({ input: msg, onFile: setFile, onSend: send, onDrag: (on) => card.classList.toggle('drag', on) });
render();
if (Beam.firstRun) setTimeout(Beam.openSettings, 700);
</script>
</body>
</html>
